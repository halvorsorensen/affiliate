<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder portrett: mirror selfie">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD7CC"/>
      <stop offset="55%" stop-color="#E89A9A"/>
      <stop offset="100%" stop-color="#A85B5B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="34%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#FFF1EB" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#FFF1EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="400" height="500" fill="url(#bg1)"/>
  <rect width="400" height="500" fill="url(#glow1)"/>

  <!-- Silhouette (myk, abstrakt mirror-selfie-pose) -->
