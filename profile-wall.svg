<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: rutenett av profiler">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1626"/>
      <stop offset="100%" stop-color="#1A1F2E"/>
    </linearGradient>
    <linearGradient id="pa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCD7CC"/><stop offset="1" stop-color="#A85B5B"/></linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E1D6"/><stop offset="1" stop-color="#7A4146"/></linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0A19E"/><stop offset="1" stop-color="#3A2230"/></linearGradient>
    <linearGradient id="pd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE7DF"/><stop offset="1" stop-color="#D88C8C"/></linearGradient>
    <linearGradient id="pe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8A5A5"/><stop offset="1" stop-color="#2A1626"/></linearGradient>
    <linearGradient id="pf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D2CC"/><stop offset="1" stop-color="#B97070"/></linearGradient>
    <symbol id="silh" viewBox="0 0 120 110">
      <ellipse cx="60" cy="40" rx="20" ry="24" fill="#1A0B14" opacity=".55"/>
      <ellipse cx="60" cy="110" rx="48" ry="26" fill="#1A0B14" opacity=".55"/>
    </symbol>
    <radialGradient id="vignette" cx="50%" cy="58%" r="65%">
      <stop offset="55%" stop-color="#1A1F2E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A1F2E" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#wbg)"/>

  <!-- 3 cols × 4 rows av profil-thumbs -->
  <g>
    <!-- Rad 1 -->
    <g transform="translate(14,14)">
      <rect width="117" height="110" rx="14" fill="url(#pa)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
      <circle cx="104" cy="14" r="5" fill="#2ECC71"/>
    </g>
    <g transform="translate(141,14)">
      <rect width="118" height="110" rx="14" fill="url(#pb)"/>
      <use href="#silh" x="0" y="0" width="118" height="107"/>
    </g>
    <g transform="translate(269,14)">
      <rect width="117" height="110" rx="14" fill="url(#pc)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
      <circle cx="104" cy="14" r="5" fill="#2ECC71"/>
    </g>
    <!-- Rad 2 -->
    <g transform="translate(14,134)">
      <rect width="117" height="110" rx="14" fill="url(#pd)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
    </g>
    <g transform="translate(141,134)">
      <rect width="118" height="110" rx="14" fill="url(#pe)"/>
      <use href="#silh" x="0" y="0" width="118" height="107"/>
      <circle cx="105" cy="14" r="5" fill="#2ECC71"/>
    </g>
    <g transform="translate(269,134)">
      <rect width="117" height="110" rx="14" fill="url(#pf)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
    </g>
    <!-- Rad 3 -->
    <g transform="translate(14,254)">
      <rect width="117" height="110" rx="14" fill="url(#pb)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
      <circle cx="104" cy="14" r="5" fill="#2ECC71"/>
    </g>
    <g transform="translate(141,254)">
      <rect width="118" height="110" rx="14" fill="url(#pa)"/>
      <use href="#silh" x="0" y="0" width="118" height="107"/>
    </g>
    <g transform="translate(269,254)">
      <rect width="117" height="110" rx="14" fill="url(#pd)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
      <circle cx="104" cy="14" r="5" fill="#2ECC71"/>
    </g>
    <!-- Rad 4 -->
    <g transform="translate(14,374)">
      <rect width="117" height="110" rx="14" fill="url(#pc)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
    </g>
    <g transform="translate(141,374)">
      <rect width="118" height="110" rx="14" fill="url(#pf)"/>
      <use href="#silh" x="0" y="0" width="118" height="107"/>
      <circle cx="105" cy="14" r="5" fill="#2ECC71"/>
    </g>
    <g transform="translate(269,374)">
      <rect width="117" height="110" rx="14" fill="url(#pe)"/>
      <use href="#silh" x="0" y="0" width="117" height="107"/>
      <circle cx="104" cy="14" r="5" fill="#2ECC71"/>
    </g>
  </g>

  <!-- Subtil vignette så CTA-tekst leses bedre -->
  <rect width="400" height="500" fill="url(#vignette)"/>
</svg>
